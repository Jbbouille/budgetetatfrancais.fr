name: Régénérer les données

# Retélécharge les fichiers .xlsx de l'Insee, reconstruit data/cofog.json et
# ne commite que si les chiffres ont réellement changé.
#
# Portée : ce workflow garde le site synchronisé avec la page Insee configurée
# dans scripts/build_data.py (BASE). Il ne détecte PAS l'arrivée d'un nouveau
# millésime, qui vit à une autre adresse : celui-là demande de changer BASE à
# la main, puis de relancer ce workflow.

on:
  schedule:
    - cron: '0 5 15 * *'   # le 15 de chaque mois, 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: pip install --quiet openpyxl requests

      # Le script échoue si la somme des dix fonctions ne retombe pas sur le
      # total publié : un fichier Insee restructuré arrête donc la chaîne ici,
      # avant de pouvoir écrire des chiffres faux sur le site.
      - name: Construire data/cofog.json
        run: python scripts/build_data.py

      - name: Commiter si les chiffres ont changé
        run: |
          set -euo pipefail

          if git diff --quiet -- data/cofog.json; then
            echo "Aucun changement."
            exit 0
          fi

          # Le champ "genere" change à chaque exécution. On le retire des deux
          # versions avant comparaison, sinon le workflow produirait un commit
          # vide de sens tous les mois. Comparaison sur les octets : passer du
          # JSON accentué par des variables shell dépend de la locale.
          sans_date() { sed 's/"genere":"[^"]*",//' "$1"; }
          git show HEAD:data/cofog.json > /tmp/avant.json

          if diff -q <(sans_date /tmp/avant.json) <(sans_date data/cofog.json) > /dev/null; then
            echo "Seul l'horodatage a changé : on ne commite pas."
            git checkout -- data/cofog.json
            exit 0
          fi

          echo "Les chiffres ont changé."
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cofog.json
          git commit -m "Données Insee régénérées automatiquement"
          git push
